    <script type="module">

        async function init() {

// <!--
//   - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)
//   - @Author: wp/electronicminer

        // 圆形光点贴图（避免 Points 渲染成方块）
        let dotTex = null;
        function makeDotTexture() {
          if (dotTex) return dotTex;
          var c = document.createElement('canvas');
          c.width = c.height = 64;
          var g = c.getContext('2d');
          var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
          grd.addColorStop(0, 'rgba(255,255,255,1)');
          grd.addColorStop(0.3, 'rgba(255,245,215,0.85)');
          grd.addColorStop(0.65, 'rgba(255,222,160,0.30)');
          grd.addColorStop(1, 'rgba(255,210,140,0)');
          g.fillStyle = grd;
          g.fillRect(0, 0, 64, 64);
          dotTex = new THREE.CanvasTexture(c);
          dotTex.colorSpace = THREE.SRGBColorSpace;
          return dotTex;
        }
        // ===== 螺旋上升光流（明显的粒子动效） =====
        let flowSprites = [];
        function createFlowParticles() {
          var COUNT = 110;
          var tex = makeDotTexture();
          for (var i = 0; i < COUNT; i++) {
            var mat = new THREE.SpriteMaterial({
              map: tex, color: 0xfff2d0, transparent: true, opacity: 0.9,
              blending: THREE.AdditiveBlending, depthWrite: false
            });
            var sp = new THREE.Sprite(mat);
            sp.userData = {
              ang: Math.random() * Math.PI * 2,
              t: Math.random(),
              rise: 0.05 + Math.random() * 0.09,
              spin: 0.4 + Math.random() * 1.1,
              size: 0.45 + Math.random() * 0.5
            };
            scene.add(sp);
            flowSprites.push(sp);
          }
        }
        function updateFlow(dt) {
          var H = CONFIG.particles.treeHeight, R = CONFIG.particles.treeRadius;
          for (var i = 0; i < flowSprites.length; i++) {
            var sp = flowSprites[i], d = sp.userData;
            d.t += d.rise * dt;
            if (d.t > 1) d.t -= 1;
            d.ang += d.spin * dt;
            var y = (d.t * H) - H / 2;
            var r = R * (1 - d.t) * 1.5 + 1.9;
            sp.position.set(Math.cos(d.ang) * r, y, Math.sin(d.ang) * r);
            var fade = Math.sin(d.t * Math.PI);
            sp.material.opacity = 0.18 + 0.75 * fade;
            sp.scale.setScalar(d.size * (0.65 + 0.55 * fade));
          }
        }
        // ===== 树本体（锥形壳）+ 旋转螺旋光带 =====
        let spiralBands, treeShell;
        function createTreeBody() {
          var H = CONFIG.particles.treeHeight, R = CONFIG.particles.treeRadius;
          // 2) 螺旋光带：3 条沿锥面上升的亮点，绕树独立旋转
          spiralBands = new THREE.Group();
          for (var b = 0; b < 3; b++) {
            var N = 300;
            var pos = new Float32Array(N * 3);
            var cols = new Float32Array(N * 3);
            for (var i = 0; i < N; i++) {
              var t = i / (N - 1);
              var y = (t * H) - H / 2;
              var r = R * (1.0 - t) * 1.55 + 1.8 + Math.random() * 0.5;
              var ang = t * Math.PI * 2 * 5.5 + (b * Math.PI * 2 / 3);
              pos[i*3] = Math.cos(ang) * r;
              pos[i*3+1] = y;
              pos[i*3+2] = Math.sin(ang) * r;
              var fade = 0.45 + 0.55 * Math.sin(t * Math.PI);
              cols[i*3] = 1.0;
              cols[i*3+1] = 0.86 * fade + 0.08;
              cols[i*3+2] = 0.52 * fade + 0.04;
            }
            var g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
            var m = new THREE.PointsMaterial({
              size: 0.52, map: makeDotTexture(), vertexColors: true, transparent: true, opacity: 0.95,
              blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
            });
            spiralBands.add(new THREE.Points(g, m));
          }
          scene.add(spiralBands);
        }


        // ===== 旋转粒子环（绕树旋转的星光） =====
        let orbitGroup;
        function createOrbitParticles() {
          orbitGroup = new THREE.Group();
          scene.add(orbitGroup);
          var COUNT = 480;
          var pos = new Float32Array(COUNT * 3);
          var cols = new Float32Array(COUNT * 3);
          var H = CONFIG.particles.treeHeight, R = CONFIG.particles.treeRadius;
          var LEVELS = [0.18, 0.42, 0.66, 0.86];
          var palette = [[1.0,0.95,0.75],[1.0,0.88,0.55],[0.95,0.97,1.0],[1.0,0.85,0.6]];
          for (var i = 0; i < COUNT; i++) {
            var ri = i % LEVELS.length;
            var lv = LEVELS[ri];
            var y = (lv * H) - H / 2;
            var ringR = R * (1 - lv) * 1.45 + 2.2;
            var ang = (i / COUNT) * Math.PI * 2 * 6 + ri * 0.7;
            var rr = ringR * (0.97 + Math.random() * 0.06);
            pos[i*3] = Math.cos(ang) * rr;
            pos[i*3+1] = y + (Math.random() - 0.5) * 0.3;
            pos[i*3+2] = Math.sin(ang) * rr;
            var c = palette[ri % palette.length];
            cols[i*3] = c[0]; cols[i*3+1] = c[1]; cols[i*3+2] = c[2];
          }
          var geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

        function setupTouchAndClick() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('pointerdown', (e) => {
                STATE.touch.active = true;
                STATE.touch.startX = e.clientX;
                STATE.touch.startY = e.clientY;
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!STATE.touch.active) return;
                const deltaX = e.clientX - STATE.touch.lastX;
                const deltaY = e.clientY - STATE.touch.lastY;
                STATE.rotation.y += deltaX * 0.005;
                STATE.rotation.x += deltaY * 0.002;
                STATE.rotation.x = Math.max(-0.5, Math.min(0.5, STATE.rotation.x));
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointerup', (e) => {
                STATE.touch.active = false;
            });
            container.addEventListener('click', (e) => {
                const moveDist = Math.hypot(e.clientX - STATE.touch.startX, e.clientY - STATE.touch.startY);
                if (moveDist > 10) return; 
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(mainGroup.children, true);
                let clickedPhoto = null;
                for (let hit of intersects) {
                    let obj = hit.object;
                    while(obj.parent && obj.parent !== mainGroup && obj.parent !== photoMeshGroup) {
                        obj = obj.parent;
                    }
                    const particle = particleSystem.find(p => p.mesh === obj && p.type === 'PHOTO');
                    if (particle) { clickedPhoto = particle; break; }
                }
                if (clickedPhoto) {
                    STATE.mode = 'FOCUS';
                    STATE.focusTarget = clickedPhoto.mesh;
                } else {
                    if (STATE.mode === 'FOCUS') {
                        STATE.mode = 'TREE';
                        STATE.focusTarget = null;
                    }
                }
            });
            let lastTap = 0;
            container.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    STATE.mode = (STATE.mode === 'SCATTER') ? 'TREE' : 'SCATTER';
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
        }

        function updateSnow() {

            const positions = snowSystem.geometry.attributes.position.array;

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {

                positions[i * 3 + 1] -= fallSpeed;
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1;
                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh; this.type = type; this.isDust = isDust;
                this.posTree = new THREE.Vector3(); this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 
                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;
                this.spinSpeed = new THREE.Vector3((Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult);
                this.calculatePositions();
            }
            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
                    return;
                }
                const h = CONFIG.particles.treeHeight;
                let t = Math.pow(Math.random(), 0.8); 
                const y = (t * h) - (h / 2);
                let rMax = Math.max(0.5, CONFIG.particles.treeRadius * (1.0 - t));
                const angle = t * 50 * Math.PI + Math.random() * Math.PI; 
                const r = rMax * (0.9 + Math.random() * 0.2); 
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
            }
            update(dt, mode, focusTargetMesh) {
                let target = (mode === 'SCATTER') ? this.posScatter : this.posTree;
                if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else target = this.posScatter;
                }
                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0; 
                this.mesh.position.lerp(target, lerpSpeed * dt);
                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt; 
                } else if (mode === 'TREE') {
                    if (this.type === 'PHOTO') {
                        this.mesh.lookAt(0, this.mesh.position.y, 0);
                        this.mesh.rotateY(Math.PI);
                    } else {
                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt);
                        this.mesh.rotation.y += 0.5 * dt; 
                    }
                }
                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) this.mesh.lookAt(camera.position); 
                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                    if (mode === 'TREE') s = 0; 
                } else if (mode === 'SCATTER' && this.type === 'PHOTO') s = this.baseScale * 2.5; 
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5; else s = this.baseScale * 0.8; 
                }
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;
            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2; const stepY = h / count; const loops = 3;
            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const normalizedH = (y + h/2) / CONFIG.particles.treeHeight; 
                const r = Math.max(1.0, CONFIG.particles.treeRadius * (1.0 - normalizedH)) + 3.0; 
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4); 
                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32); 
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55); 
            const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);
            const goldMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1, envMapIntensity: 2.0, emissive: 0x443300, emissiveIntensity: 0.3 });
            const greenMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.deepGreen, metalness: 0.2, roughness: 0.8, emissive: 0x041a09, emissiveIntensity: 0.18 });
            const redMat = new THREE.MeshPhysicalMaterial({ color: CONFIG.colors.accentRed, metalness: 0.3, roughness: 0.2, clearcoat: 1.0, emissive: 0x330000 });
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });
            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random();
                let mesh, type;
                if (rand < 0.40) { mesh = new THREE.Mesh(boxGeo, greenMat); type = 'BOX'; }
                else if (rand < 0.70) { mesh = new THREE.Mesh(boxGeo, goldMat); type = 'GOLD_BOX'; }
                else if (rand < 0.92) { mesh = new THREE.Mesh(sphereGeo, goldMat); type = 'GOLD_SPHERE'; }
                else if (rand < 0.97) { mesh = new THREE.Mesh(sphereGeo, redMat); type = 'RED'; }
                else { mesh = new THREE.Mesh(candyGeo, candyMat); type = 'CANE'; }
                const s = 0.4 + Math.random() * 0.5;
                mesh.scale.set(s,s,s); mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type, false));
            }
            const starShape = new THREE.Shape();
            const points = 5;
            for (let i = 0; i < points * 2; i++) {
                const angle = (i * Math.PI) / points + Math.PI / 2;
                const r = (i % 2 === 0) ? 1.5 : 0.7;
                const x = Math.cos(angle) * r; const y = Math.sin(angle) * r;
                if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
            }
            starShape.closePath();
            const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.4, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 });
            starGeo.center(); 
            const starMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 1.0, metalness: 1.0, roughness: 0 });
            const star = new THREE.Mesh(starGeo, starMat);
            star.position.set(0, CONFIG.particles.treeHeight/2 + 1.2, 0);
            mainGroup.add(star);
            mainGroup.add(photoMeshGroup);
        }

            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });
            for(let i=0; i<CONFIG.particles.dustCount; i++) {

        function addPhotoToScene(texture) {
            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            let width = 1.2; let height = 1.2;
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) height = width / aspect; else width = height * aspect;
            }
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.04;
            const group = new THREE.Group();
            group.add(frame); group.add(photo);
            frame.scale.set(width/1.2, height/1.2, 1);
            const s = 0.8; group.scale.set(s,s,s);
            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO', false));
            updatePhotoLayout();
        }

            W = window.innerWidth; H = window.innerHeight;
            hc.width = Math.round(W*DPR); hc.height = Math.round(H*DPR);
            hx.setTransform(DPR,0,0,DPR,0,0);
          }
          resize();
          window.addEventListener('resize', resize);
          function spawn(){
            var n = Math.max(14, Math.min(24, Math.floor(W*H/34000)));
            hearts = [];
            for (var i=0;i<n;i++){
              var right = i%2===1;
              hearts.push({
                side:right?1:0,
                x: right ? W*(.68+Math.random()*.30) : W*(.02+Math.random()*.28),
                y: Math.random()*H,
                s: 4+Math.random()*7,
                v: .25+Math.random()*.55,
                drift: (Math.random()-.5)*.5,
                ph: Math.random()*Math.PI*2,
                a: .12+Math.random()*.22,
                c: COLORS[(Math.random()*COLORS.length)|0]
              });
            }
          }
          spawn();
          function tick(){
            hx.clearRect(0,0,W,H);
            var now = performance.now();
            for (var i=0;i<hearts.length;i++){
              var ht=hearts[i];
              ht.y -= ht.v;
              ht.x += ht.drift + Math.sin(now*.001+ht.ph)*.3;
              var lo = ht.side ? W*.66 : 0, hi = ht.side ? W : W*.34;
              if (ht.y < -20){ ht.y = H+20; ht.x = lo+Math.random()*(hi-lo); }
              if (ht.x < lo-15) ht.x = hi;
              if (ht.x > hi+15) ht.x = lo;
              var al = ht.a*(.6+.4*(.5+.5*Math.sin(now*.0015+ht.ph)));
              var sp = sprites[ht.c], d = ht.s*2.4;
              hx.globalAlpha = al;
              hx.drawImage(sp, ht.x-d/2, ht.y-d/2, d, d);
            }
            hx.globalAlpha = 1;
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        })();

        init();
    </script>
</body>
</html>
